[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Photos : gardées en mémoire par le téléphone (pas de nouvelle requête à chaque page en connexion lente).
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
