server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression du texte (HTML, CSS, scripts) : essentiel en connexion lente.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain application/xml;

    # /programme sert programme.html (pages pré-générées).
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Fichiers au nom unique à chaque build : gardés un an par le téléphone.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /photos/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }
}
